<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Formaskills Travel OS</title>
<!--
  Formaskills Travel OS — outil de gestion 100% autonome
  --------------------------------------------------------
  * Aucune dépendance externe : ni serveur, ni CDN, ni API, ni compte.
  * Fonctionne hors-ligne, pour toujours. Un simple fichier HTML.
  * Toutes les données sont sauvegardées dans le navigateur (localStorage)
    + export/import JSON pour ne jamais rien perdre.
  * Remplace Airtable (tables T1..T9 + conformité R1..R8) et Make
    (moteur d'automatisations côté client).
  Toute la logique est ci-dessous, sans minification, pour rester
  lisible et maintenable indéfiniment.
-->
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f8fafc; --ink:#0f1e37; --muted:#607089;
  --line:#e3e9f2; --brand:#1d5fd6; --brand-ink:#0b3f9e; --brand-soft:#e8f0ff;
  --ok:#12915b; --ok-soft:#e2f6ec; --warn:#c9820a; --warn-soft:#fdf1dc;
  --bad:#d13c3c; --bad-soft:#fbe6e6; --accent:#7b4bd6; --accent-soft:#efe8fb;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 8px 28px rgba(16,32,64,.08);
  --shadow-sm:0 1px 2px rgba(16,32,64,.08);
  --r:14px; --r-sm:10px; --sp:16px; --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="dark"]{
  --bg:#0c1220; --panel:#111a2e; --panel-2:#0e1626; --ink:#e9eef8; --muted:#93a2bd;
  --line:#213150; --brand:#5b8dff; --brand-ink:#a8c4ff; --brand-soft:#16243f;
  --ok:#3ecb8a; --ok-soft:#122a20; --warn:#f0b34e; --warn-soft:#2c2412;
  --bad:#f4756f; --bad-soft:#2c1717; --accent:#b18bf0; --accent-soft:#221a36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
::selection{background:var(--brand-soft)}
/* Layout */
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:var(--shadow-sm)}
.brand b{font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600}
nav{padding:10px;overflow:auto;flex:1;min-height:0}
.nav-group{margin:6px 8px 2px;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:transparent;border-radius:10px;color:var(--ink);cursor:pointer;text-align:left;font-weight:600;transition:background .18s var(--ease),transform .1s var(--ease),color .18s}
.nav-item:hover{background:var(--panel-2)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-ink)}
.nav-item .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-weight:700;min-width:22px;text-align:center}
.nav-item.active .badge{background:#fff;border-color:transparent;color:var(--brand-ink)}
:root[data-theme="dark"] .nav-item.active .badge{background:var(--brand-soft)}
aside .foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
main{min-width:0;display:flex;flex-direction:column;min-height:0}
header.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
header.top .sub{color:var(--muted);font-size:12.5px;font-weight:600}
.spacer{flex:1}
.view{padding:22px;overflow:auto;flex:1;min-height:0}
.view-anim{animation:fade .32s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer;transition:transform .12s var(--ease),box-shadow .18s var(--ease),background .18s,border-color .18s;box-shadow:var(--shadow-sm)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-ink));border-color:transparent;color:#fff}
.btn.accent{background:linear-gradient(135deg,var(--accent),#5b34b0);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.icon{padding:8px;width:36px;height:36px;justify-content:center}
.btn .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
/* Cards & grid */
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.card.hover:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .lab{color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:700}
.kpi .dot{width:9px;height:9px;border-radius:50%}
.section-title{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:26px 2px 12px}
.section-title:first-child{margin-top:4px}
/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.selrow{background:var(--brand-soft)}
.chk.on svg{opacity:1}
.lists-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.lchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:12.5px;cursor:pointer;transition:all .16s var(--ease)}
.lchip:hover{background:var(--panel-2);transform:translateY(-1px)}
.lchip.on{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink)}
.lchip .lc{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:0 7px;font-size:11px;min-width:20px;text-align:center}
.lchip.on .lc{background:#fff;border-color:transparent;color:var(--brand-ink)}
:root[data-theme="dark"] .lchip.on .lc{background:var(--panel)}
.cell-strong{font-weight:700}
.muted{color:var(--muted)}
.rowact{opacity:0;transition:opacity .16s}
tr:hover .rowact{opacity:1}
/* chips / tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.tag.b{background:var(--brand-soft);color:var(--brand-ink)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--bad-soft);color:var(--bad)}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.n{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.input,textarea,select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);transition:border-color .16s,box-shadow .16s;outline:none}
.input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:80px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba:8,14,26,.5;background:rgba(8,14,26,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;animation:fade .2s var(--ease);padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(620px,96vw);max-height:90vh;overflow:auto;animation:pop .26s var(--ease)}
.modal.wide{width:min(920px,96vw)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal .mhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal .mhead h3{margin:0;font-size:16px;font-weight:800}
.modal .mbody{padding:20px}
.modal .mfoot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:90}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);min-width:240px;max-width:360px;font-weight:600;animation:slidein .3s var(--ease);display:flex;gap:10px;align-items:center}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
/* misc */
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty svg{width:44px;height:44px;stroke:var(--muted);fill:none;stroke-width:1.5;opacity:.6;margin-bottom:10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.pill-tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.pill-tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .18s var(--ease)}
.pill-tabs button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.progress{height:8px;background:var(--panel-2);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:20px;transition:width .5s var(--ease)}
.checkline{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--panel-2);transition:background .16s}
.checkline:hover{background:var(--panel)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;transition:all .18s var(--ease)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;opacity:0;transition:opacity .18s}
.chk.on svg{opacity:1}
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{flex:0 0 260px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.kcol h4{margin:4px 6px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:grab;transition:transform .14s var(--ease),box-shadow .18s}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard.drag{opacity:.4}
.kcol.over{outline:2px dashed var(--brand);outline-offset:-4px}
.meter-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.helpbox{background:var(--brand-soft);border:1px solid transparent;border-radius:12px;padding:14px 16px;color:var(--brand-ink);font-weight:600;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.helpbox svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;margin-top:1px}
code.k{background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12.5px}
.copybtn{cursor:pointer}
.scorebar{display:inline-flex;align-items:center;gap:7px}
.scorebar .track{width:64px;height:6px;border-radius:20px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.scorebar .track > i{display:block;height:100%;border-radius:20px}
.result-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel);transition:background .14s,transform .12s}
.result-row:hover{background:var(--panel-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.switch{width:42px;height:24px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch.on{background:var(--ok)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on i{left:21px}
.divider{height:1px;background:var(--line);margin:18px 0}
.stat-mini{display:flex;gap:6px;align-items:baseline}
.stat-mini b{font-size:19px;font-weight:800}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:70;transform:translateX(-100%);transition:transform .26s var(--ease)}
  aside.open{transform:none}
  .row2,.row3{grid-template-columns:1fr}
  #menuBtn{display:inline-flex!important}
}
#menuBtn{display:none}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">FT</div>
      <div><b>Travel OS</b><small>Formaskills · autonome</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <button class="btn ghost sm" id="themeBtn" title="Thème clair/sombre" style="flex:1">Thème sombre</button>
      <button class="btn ghost sm" id="backupBtn" title="Exporter une sauvegarde">Sauvegarde</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <button class="btn ghost icon" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div>
        <h1 id="viewTitle">Tableau de bord</h1>
        <div class="sub" id="viewSub">Vue d'ensemble de l'activité</div>
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="quickAdd">+ Ajouter</button>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="scrape-core.js"></script>
<script src="app.js"></script>
</body>
</html>
