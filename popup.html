<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --soft:#f5f7fb; --ink:#0f1e37; --muted:#64748b;
  --line:#e6ebf3; --brand:#1d5fd6; --brand-ink:#0b3f9e; --brand-soft:#e8f0ff;
  --ok:#12915b; --ok-soft:#e4f7ec; --warn:#c9820a; --warn-soft:#fdf1dc; --bad:#d13c3c;
  --accent:#7b4bd6; --r:12px; --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1626; --panel:#111a2e; --soft:#0c1424; --ink:#e9eef8; --muted:#93a2bd;
  --line:#213150; --brand:#5b8dff; --brand-ink:#a8c4ff; --brand-soft:#16243f;
  --ok:#3ecb8a; --ok-soft:#122a20; --warn:#f0b34e; --warn-soft:#2c2412; --bad:#f4756f; --accent:#b18bf0;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{width:390px;max-height:580px;overflow:hidden;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.head b{font-size:14px}
.head small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.head .sp{flex:1}
.link{color:var(--brand);font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.ctx{display:flex;align-items:center;gap:8px;padding:9px 15px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.ctx .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.ctx.li .dot{background:var(--brand)} .ctx .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:14px 15px;overflow:auto;flex:1;min-height:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;transition:transform .1s var(--ease),box-shadow .18s,background .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,32,64,.12)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-ink));border-color:transparent;color:#fff}
.btn.sm{width:auto;padding:7px 12px;font-size:12.5px;border-radius:9px}
.status{color:var(--muted);font-weight:600;font-size:12px;margin-top:10px;min-height:16px}
.toolbar{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.count{font-weight:800}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;transition:background .14s}
.row:hover{background:var(--soft)} .row.on{background:var(--brand-soft);border-color:transparent}
.chk{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.chk svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3.2;opacity:0}
.row.on .chk{background:var(--brand);border-color:var(--brand)} .row.on .chk svg{opacity:1}
.row .info{min-width:0;flex:1}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--brand-ink)}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:3px}
.tag.g{background:var(--ok-soft);color:var(--ok)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.n{background:var(--soft);color:var(--muted)}
.save{border-top:1px solid var(--line);padding:12px 15px;background:var(--panel)}
.save .r2{display:flex;gap:8px;align-items:center;margin-bottom:9px}
select,input{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;outline:none}
select:focus,input:focus{border-color:var(--brand)}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:22px 10px;font-size:12.5px}
.field-lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pages{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:600;color:var(--muted)}
.pages input{width:56px;text-align:center}
.hide{display:none}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="head">
    <div class="logo">FT</div>
    <div><b>Travel OS</b><small>Contacts &amp; prospection</small></div>
    <div class="sp"></div>
    <a class="link" id="openApp">Ouvrir l'outil &rsaquo;</a>
  </div>
  <div class="ctx" id="ctx"><span class="dot"></span><span class="t" id="ctxText">Chargement…</span></div>
  <div class="body">
    <button class="btn primary" id="scan"><span id="scanLabel">Analyser cette page</span></button>
    <div class="pages hide" id="pagesWrap">Pages LinkedIn à parcourir : <input type="number" id="pages" value="1" min="1" max="10"></div>
    <div class="status" id="status"></div>
    <div class="toolbar hide" id="toolbar">
      <span class="chk" id="selAll"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
      <span class="count" id="count">0</span> sélectionné(s)
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="save hide" id="saveBar">
    <div class="field-lab">Enregistrer dans une liste</div>
    <div class="r2">
      <select id="listSel"></select>
      <button class="btn sm" id="newList">Nouvelle</button>
    </div>
    <button class="btn primary" id="saveBtn">Enregistrer <span id="saveN"></span></button>
  </div>
  <script src="scrape-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
